jwt:
  secret: $(JWT_SECRET}
  expiration: 86400000


spring:
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    #url: jdbc:h2:mem:testdb
    url: jdbc:h2:file:./data/newsdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

news:
  api:
    base-url: https://newsapi.org/v2
    api-key: ${NEWS_API_KEY}
